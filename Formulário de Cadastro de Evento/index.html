<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <section class="section">
            <div id="Titulo">
                <h1>🌽🌽Cadastro para a Palestra do milhão🌽🌽</h1>
            </div>
        </section>
        <section class="section">
            <div id="Formulario">
                <form>
                    <div>
                        <label for="Nome">Nome:</label>
                        <input id="Nome" type="text" placeholder="Escreva seu nome completo" required>
                    </div>
                    <div>
                        <label for="E-mail">E-mail: </label>
                        <input id="E-mail" type="email">
                    </div>
                    <div>
                        <label for="DataNascimento"> Data de Nascimento: </label>
                        <input id="DataNascimento" type="date">
                    </div>
                    <div>
                        <label for="Ingresso">Ingresso: </label>
                        <select id="Ingresso">
                            <option value="Meia">Meia</option>
                            <option value="Interira">Interira</option>
                            <option value="Vip">Vip</option>
                        </select>
                    </div>
                    <div></div>
                    <label for="Observação">Observação: </label>
                    <textarea id="Observação"></textarea>
                    <button id="reset" type="reset">Limpar</button>
                    <button id="submit" type="submit">Enviar</button>
            </div>
            </form>
            </div>
        </section>
    </main>
</body>

</html>
